server:
  port: 8080 # Define a porta pública de entrada do API Gateway.

spring:
  application:
    name: TEDUND1BESMATT2GR2_BACK_Gateway # Define o nome deste serviço no catálogo.
  cloud:
    gateway:
      server:
        webflux: # Ativa a configuração reativa exigida nesta versão do Spring Cloud.
          globalcors:
            cors-configurations:
              '[/**]': # Aplica as regras de CORS para todas as rotas do Gateway.
                allowedOrigins: "http://localhost:4200" # Autoriza requisições vindas do frontend Angular.
                allowedMethods: # Define os métodos HTTP permitidos nas chamadas externas.
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                allowedHeaders: "*" # Permite qualquer cabeçalho HTTP nas requisições.
                allowCredentials: true # Autoriza o envio de cookies e tokens de autenticação.
          routes:
            - id: usuario-service # Identifica a regra de roteamento para o serviço de usuários.
              uri: lb://USUARIO-SERVICE # Encaminha a chamada via balanceador de carga pelo Eureka.
              predicates:
                - Path=/api/usuarios/** # Filtra e redireciona todas as URLs iniciadas com /api/usuarios/.

management:
  endpoints:
    web:
      exposure:
        include: health,gateway # Expõe os endpoints de saúde e diagnóstico de rotas na web.

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/ # Define o endereço do servidor Eureka.
    fetch-registry: true # Baixa a lista de microsserviços ativos para rotear chamadas.
    register-with-eureka: true # Registra o próprio Gateway no catálogo do Eureka.
  instance:
    prefer-ip-address: true # Usa o endereço IP em vez do nome do host no registro.